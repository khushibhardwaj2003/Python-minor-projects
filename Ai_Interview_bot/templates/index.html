<!DOCTYPE html>
<html>
<head>
    <title>Interview Expert</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎯 Hi I'm your Interview Expert</h1>

    <div class="input-section">

        <input
            type="text"
            id="subject"
            placeholder="Enter your Topic">

        <input
            type="number"
            id="num_questions"
            placeholder="Number of Questions"
            min="1"
            max="20">

        <button onclick="generateQuestions()">
            Generate Questions
        </button>

    </div>

    <div class="chat-box">

        <div class="bot-message">
            Enter a topic and I'll create interview questions for you.
        </div>

        <div id="output"></div>

    </div>

</div>

<script>

async function generateQuestions() {

    let subject =
        document.getElementById("subject").value;

    let num_questions =
        document.getElementById("num_questions").value;

    let response = await fetch("/generate", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            subject: subject,
            num_questions: num_questions
        })

    });

    let data = await response.json();

    document.getElementById("output").innerHTML =
        `<div class="bot-message">${data.response.replace(/\n/g,'<br>')}</div>`;
}

</script>

</body>
</html>
