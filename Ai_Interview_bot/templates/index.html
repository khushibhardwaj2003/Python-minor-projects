<!DOCTYPE html>
<html>
<head>
    <title>Interview Expert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- PAGE 1 -->

<div id="page1" class="page">

    <div class="banner">
        <h1>Hi I'am your<br>Interview Expert</h1>
    </div>

    <button onclick="showPage2()" class="main-btn">
        Click Here To Chat
    </button>

</div>

<!-- PAGE 2 -->

<div id="page2" class="page" style="display:none;">

    <div class="banner">
        <h1>Interview Expert</h1>
    </div>

    <div class="form-box">

        <input
            type="text"
            id="subject"
            placeholder="Enter Topic">

        <input
            type="number"
            id="num_questions"
            placeholder="Number of Questions">

        <button onclick="generateQuestions()" class="main-btn">
            Generate Questions
        </button>

    </div>

</div>

<!-- PAGE 3 -->

<div id="page3" class="page" style="display:none;">

    <div class="question-title">
        Here are the questions
    </div>

    <div id="output"></div>

</div>

<script>

function showPage2(){

    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";

}

async function generateQuestions(){

    let subject =
    document.getElementById("subject").value;

    let num_questions =
    document.getElementById("num_questions").value;

    let response = await fetch("/generate",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            subject:subject,
            num_questions:num_questions
        })

    });

    let data = await response.json();

    document.getElementById("page2").style.display="none";
    document.getElementById("page3").style.display="block";

    document.getElementById("output").innerHTML =
    data.response.replace(/\n/g,"<br>");

}

</script>

</body>
</html>
